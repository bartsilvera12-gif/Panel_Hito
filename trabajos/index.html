  (function(){
    var imgs = [].slice.call(document.querySelectorAll('#grid img'));
    var lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'), lbcount = document.getElementById('lbcount');
    var idx = 0;
    function show(i){ idx=(i+imgs.length)%imgs.length; lbimg.src = imgs[idx].currentSrc || imgs[idx].src; lbcount.textContent=(idx+1)+' / '+imgs.length; }
    imgs.forEach(function(im,i){ im.addEventListener('click', function(){ show(i); lb.classList.add('open'); }); });
    function close(){ lb.classList.remove('open'); lbimg.src=''; }
    lb.querySelector('.close').addEventListener('click', close);
    lb.querySelector('.next').addEventListener('click', function(e){ e.stopPropagation(); show(idx+1); });
    lb.querySelector('.prev').addEventListener('click', function(e){ e.stopPropagation(); show(idx-1); });
    lb.addEventListener('click', function(e){ if(e.target===lb) close(); });
    document.addEventListener('keydown', function(e){ if(!lb.classList.contains('open'))return; if(e.key==='Escape')close(); if(e.key==='ArrowRight')show(idx+1); if(e.key==='ArrowLeft')show(idx-1); });
  })();
</script>
</body>
</html>
